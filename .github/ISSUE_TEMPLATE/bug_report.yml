name: Bug report
description: Something is not working the way the README says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Windows support is experimental and untested, so Windows reports are especially useful.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: For example Apple Terminal, iTerm2, Windows Terminal, PowerShell, Git Bash, tmux.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `claude-watch install`
        2. Start a Claude Code session
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `claude-watch doctor`
      description: Paste the full output. It includes recent errors from the error log.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Relevant lines from `~/.claude-watch/errors.log`, your config, Python version, Claude Code version. Remove anything private first.
    validations:
      required: false
